name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Verify CSP hashes
        run: npm run verify-csp

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.fpl0.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name=fpl0 \
            --commit-hash=${{ github.sha }} \
            --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health check
        run: |
          echo "Checking site health (with retry for CDN propagation)..."
          
          # Retry function with fixed sleep for custom-domain propagation
          check_url() {
            local url="$1"
            local label="$2"
            local max_attempts=6
            local sleep_time=10
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt/$max_attempts: checking $label..."
              
              # Use -f (fail on HTTP errors), -s (silent), -S (show errors), -L (follow redirects)
              if curl -fsSL -o /dev/null -w "%{http_code}\n" "$url" | grep -q "^200$"; then
                echo "✓ $label OK (200)"
                return 0
              fi
              
              if [ $attempt -lt $max_attempts ]; then
                echo "  Failed, waiting ${sleep_time}s for propagation..."
                sleep $sleep_time
              fi
              
              attempt=$((attempt + 1))
            done
            
            echo "✗ $label failed after $max_attempts attempts"
            return 1
          }
          
          # Check main page (handles www -> apex redirect)
          check_url "https://www.fpl0.io/" "Main page"
          main_result=$?
          
          # Check RSS feed
          check_url "https://www.fpl0.io/rss.xml" "RSS feed"
          rss_result=$?
          
          # Exit with error if any check failed
          if [ $main_result -ne 0 ] || [ $rss_result -ne 0 ]; then
            echo "Health checks failed!"
            exit 1
          fi
          
          echo "All health checks passed!"
