name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.fpl0.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name=fpl0 \
            --commit-hash=${{ github.sha }} \
            --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health check
        run: |
          echo "Checking site health..."
          
          # Check main page
          status_code=$(curl -s -o /dev/null -w "%{http_code}" https://www.fpl0.io/)
          if [ "$status_code" != "200" ]; then
            echo "Error: Main page returned status $status_code"
            exit 1
          fi
          echo "✓ Main page OK (200)"
          
          # Check RSS feed
          rss_status=$(curl -s -o /dev/null -w "%{http_code}" https://www.fpl0.io/rss.xml)
          if [ "$rss_status" != "200" ]; then
            echo "Error: RSS feed returned status $rss_status"
            exit 1
          fi
          echo "✓ RSS feed OK (200)"
          
          echo "All health checks passed!"
